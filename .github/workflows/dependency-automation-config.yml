name: Dependency Automation Configuration

on:
  push:
    branches: [main, dependency-automation-trial]
    paths:
      - '.github/workflows/dependency-automation-config.yml'
      - 'renovate.json'
      - 'renovate-presets/**'
  pull_request:
    branches: [main, dependency-automation-trial]
    paths:
      - '.github/workflows/dependency-automation-config.yml'
      - 'renovate.json'
      - 'renovate-presets/**'
  workflow_dispatch:
    inputs:
      run_hosted_dry_run:
        description: Run the post-publication GitHub-platform full dry run
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # renovate: datasource=npm depName=renovate
  RENOVATE_VERSION: '44.65.5'

jobs:
  validate-renovate-config:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate repository configuration and shared preset
        run: >-
          npx --yes --package="renovate@${RENOVATE_VERSION}" renovate-config-validator
          --strict --no-global renovate.json renovate-presets/default.json

  # Temporary non-default-branch fallback. Remove the push arm during promotion.
  hosted-renovate-dry-run:
    if: >-
      ${{
        github.ref == 'refs/heads/dependency-automation-trial' &&
        ((github.event_name == 'workflow_dispatch' && inputs.run_hosted_dry_run) ||
          (github.event_name == 'push' &&
            contains(github.event.head_commit.message, '[run-hosted-renovate-dry-run]')))
      }}
    needs: validate-renovate-config
    permissions:
      checks: read
      contents: read
      issues: read
      pull-requests: read
      security-events: read
      statuses: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the exact trial source
        uses: actions/checkout@v6
        with:
          ref: dependency-automation-trial
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Verify trial source, configuration, and preset revisions
        shell: bash
        run: |
          set -euo pipefail

          source_sha="$(git rev-parse HEAD)"
          config_blob_sha="$(git rev-parse HEAD:renovate.json)"
          preset_blob_sha="$(git rev-parse HEAD:renovate-presets/default.json)"
          preset_ref_sha="$(git ls-remote origin refs/heads/dependency-automation-trial | cut -f1)"

          [[ -n "${preset_ref_sha}" ]]
          [[ "${source_sha}" == "${preset_ref_sha}" ]]
          jq -e '
            .extends == ["github>budgetanalyzer/orchestration//renovate-presets/default#dependency-automation-trial"]
          ' renovate.json > /dev/null

          {
            echo '## Hosted Renovate trial revisions'
            echo
            printf -- '- source SHA: %s\n' "${source_sha}"
            printf -- '- repository config blob SHA: %s\n' "${config_blob_sha}"
            printf -- '- preset ref SHA: %s\n' "${preset_ref_sha}"
            printf -- '- preset blob SHA: %s\n' "${preset_blob_sha}"
          } | tee dependency-automation-revisions.log >> "${GITHUB_STEP_SUMMARY}"

      - name: Run read-only hosted full dry run
        env:
          LOG_LEVEL: debug
          RENOVATE_BASE_BRANCH_PATTERNS: '["dependency-automation-trial"]'
          RENOVATE_CONFIG_FILE: dependency-automation-evidence/renovate-trial-global-config.json
          RENOVATE_CONFIG_VALIDATION_ERROR: 'true'
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: optional
          RENOVATE_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dependency-automation-evidence

          jq -e --arg repository "${GITHUB_REPOSITORY}" '
            {
              onboarding: false,
              requireConfig: "optional",
              repositories: [({repository: $repository} + .)]
            }
          ' renovate.json \
            > dependency-automation-evidence/renovate-trial-global-config.json

          npx --yes --package="renovate@${RENOVATE_VERSION}" \
            renovate-config-validator --strict \
            dependency-automation-evidence/renovate-trial-global-config.json

          npx --yes "renovate@${RENOVATE_VERSION}" \
            --platform=github \
            --dry-run=full 2>&1 \
            | tee dependency-automation-evidence/renovate-debug.log

          renovate_log=dependency-automation-evidence/renovate-debug.log
          require_log_evidence() {
            description="$1"
            pattern="$2"
            if ! grep -Fq "${pattern}" "${renovate_log}"; then
              printf 'Missing required Renovate evidence: %s\n' "${description}" >&2
              return 1
            fi
          }

          require_log_evidence 'dependency extraction' 'Dependency extraction complete'
          require_log_evidence 'exact trial base' 'baseBranch=dependency-automation-trial'
          require_log_evidence 'dry-run mutation simulation' 'DRY-RUN:'
          require_log_evidence 'successful repository result' 'Repository result: done,'

          if grep -Eq '^[[:space:]]*(ERROR|FATAL):' "${renovate_log}"; then
            echo 'Renovate emitted an ERROR or FATAL record.' >&2
            exit 1
          fi

      - name: Measure complete trial Renovate evidence
        id: trial-evidence
        if: ${{ always() }}
        run: >-
          bash .github/scripts/prepare-trial-evidence.sh
          dependency-automation-evidence/renovate-evidence.tar.gz
          'Trial hosted Renovate dry run'
          dependency-automation-revisions.log
          dependency-automation-evidence/renovate-trial-global-config.json
          dependency-automation-evidence/renovate-debug.log

      - name: Upload capped trial Renovate evidence
        if: >-
          ${{
            always() && vars.DEPENDENCY_AUTOMATION_TRIAL_UPLOADS_ENABLED == 'true' &&
            steps.trial-evidence.outputs.upload_allowed == 'true'
          }}
        uses: actions/upload-artifact@v7
        with:
          name: trial-renovate-evidence-${{ github.run_id }}
          path: dependency-automation-evidence/renovate-evidence.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Enforce complete trial Renovate evidence delivery
        if: >-
          ${{
            always() && vars.DEPENDENCY_AUTOMATION_TRIAL_UPLOADS_ENABLED == 'true' &&
            steps.trial-evidence.outputs.upload_allowed != 'true'
          }}
        run: |
          echo 'The complete trial Renovate evidence exceeds the capped upload allowance.' >&2
          exit 1
