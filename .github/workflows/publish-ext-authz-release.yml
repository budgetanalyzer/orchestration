name: Publish ext-authz Release

on:
  push:
    tags:
      - "v*"
      - "candidate-*"
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Existing release tag to build"
        required: true
        type: string
      image_tag:
        description: "Published image tag override; must match the tag-derived image tag"
        required: false
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/budgetanalyzer/ext-authz

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_ref || github.ref_name }}
          fetch-depth: 0

      - name: Resolve release inputs
        id: release
        shell: bash
        run: |
          set -euo pipefail

          event_name="${GITHUB_EVENT_NAME}"
          release_ref="${{ inputs.release_ref || github.ref_name }}"
          requested_image_tag="${{ inputs.image_tag || '' }}"

          if [[ -z "${release_ref}" ]]; then
            echo "release_ref is required." >&2
            exit 1
          fi

          if [[ "${event_name}" == "workflow_dispatch" ]]; then
            if ! git show-ref --verify --quiet "refs/tags/${release_ref}"; then
              echo "workflow_dispatch release_ref must be an existing Git tag, got ${release_ref}." >&2
              exit 1
            fi
          fi

          if [[ "${release_ref}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            derived_image_tag="${release_ref#v}"
          elif [[ "${release_ref}" =~ ^candidate-[A-Za-z0-9_.-]+$ ]]; then
            derived_image_tag="${release_ref}"
          else
            echo "release_ref must be a SemVer tag like v1.2.3 or a candidate-* tag, got ${release_ref}." >&2
            exit 1
          fi

          if [[ -n "${requested_image_tag}" && "${requested_image_tag}" != "${derived_image_tag}" ]]; then
            echo "image_tag override must match the derived tag ${derived_image_tag}; candidate and release images are tag-derived." >&2
            exit 1
          fi

          image_tag="${derived_image_tag}"
          if [[ ! "${image_tag}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ || "${image_tag}" == "latest" ]]; then
            echo "Resolved image_tag is not Docker-safe or is disallowed: ${image_tag}." >&2
            exit 1
          fi

          echo "image_tag=${image_tag}" >> "${GITHUB_OUTPUT}"

      - name: Resolve checked-out revision
        id: source
        shell: bash
        run: |
          set -euo pipefail

          commit_sha="$(git rev-parse HEAD)"
          echo "commit_sha=${commit_sha}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./ext-authz
          file: ./ext-authz/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.release.outputs.image_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.commit_sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.image_tag }}

      - name: Print digest-pinned reference
        shell: bash
        run: |
          echo "${IMAGE_NAME}:${{ steps.release.outputs.image_tag }}@${{ steps.build.outputs.digest }}"
