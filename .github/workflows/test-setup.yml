name: Validate Linux Setup Sources

on:
  push:
    branches: [main, setup]
    paths:
      - 'setup.sh'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/test-setup.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:  # Manual trigger button

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  validate-linux-setup-sources:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate script syntax
        shell: bash
        run: |
          bash -n setup.sh
          find scripts -name "*.sh" -exec bash -n {} \;
          find tests -name "*.sh" -exec bash -n {} \;

      - name: Run focused offline setup contracts
        run: |
          ./tests/local-kubernetes-target/test-local-kubernetes-target.sh
          ./tests/native-preflight-wrapper/test-native-preflight-wrapper.sh
          ./tests/imported-ingress-tls/test-install-imported-ingress-tls.sh
