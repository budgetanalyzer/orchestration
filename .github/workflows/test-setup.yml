name: Validate Linux Setup Sources

on:
  push:
    branches: [main, setup]
    paths:
      - 'setup.sh'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/test-setup.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:  # Manual trigger button

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  validate-linux-setup-sources:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate script syntax
        shell: bash
        run: |
          bash -n setup.sh
          find scripts -name "*.sh" -exec bash -n {} \;
          find tests -name "*.sh" -exec bash -n {} \;

      - name: Run focused offline setup contracts
        run: |
          ./tests/platform-tools/test-platform-tool-safeguards.sh
          ./tests/local-kubernetes-target/test-local-kubernetes-target.sh
          ./tests/local-runtime/test-check-local-runtime.sh
          ./tests/imported-ingress-tls/test-install-imported-ingress-tls.sh
          ./tests/tilt-prerequisites/test-client-trust.sh

      - name: Verify amd64 and arm64 platform-tool releases
        run: ./scripts/bootstrap/verify-platform-tool-releases.sh
