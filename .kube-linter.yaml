# Repo-specific kube-linter baseline for the static security guardrails.
#
# These excludes are intentional:
# - `latest-tag` conflicts with the narrower contract implemented in
#   scripts/guardrails/check-image-pinning.sh, which allows only the local
#   Tilt-built images in the executable allowlist.
# - `no-read-only-root-fs` is not a universal repo baseline; workload-specific
#   hardening remains explicit in the checked-in manifests.
# - `unset-cpu-requirements` and `unset-memory-requirements` stay noisy for
#   short-lived init containers and local-only helper containers. This static
#   gate is meant to catch actual security regressions, not force a new
#   resource-governance policy in the same change.
checks:
  exclude:
    - latest-tag
    - no-read-only-root-fs
    - unset-cpu-requirements
    - unset-memory-requirements
