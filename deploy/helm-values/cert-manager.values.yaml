# Hardened single-node values retained for provider-neutral chart rendering and
# image evidence. Certificate issuance remains a future deployment prerequisite.
# Gateway API support stays enabled here so the HTTP ingress and public TLS paths share the same
# controller install contract.

crds:
  enabled: true

config:
  enableGatewayAPI: true

acmesolver:
  image:
    # The HTTP-01 solver pods run in application namespaces, so they must satisfy
    # the image-digest policy even though the cert-manager controllers themselves
    # live in the excluded cert-manager namespace.
    digest: sha256:bbec214d3935cbbeb3ab88c57ee36e2b2511a0017e48ffc14a999e48fa30d3a2

prometheus:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

webhook:
  replicaCount: 1
  resources:
    requests:
      cpu: 25m
      memory: 96Mi
    limits:
      cpu: 200m
      memory: 192Mi

cainjector:
  replicaCount: 1
  resources:
    requests:
      cpu: 25m
      memory: 96Mi
    limits:
      cpu: 200m
      memory: 192Mi

startupapicheck:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
