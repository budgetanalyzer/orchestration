# Production-reference Kyverno values retained for provider-neutral chart
# rendering, policy validation, and image evidence.
# Keep this file explicit and reviewable instead of relying on chart defaults for
# controller replica counts, token automount, and runtime hardening.
#
# Chart 3.8.2 does not expose first-class digest fields for the main Kyverno
# images. The helper always renders `repository:tag`, so immutable refs are
# encoded here as `repository@sha256` plus `tag=<64 hex>` to render the final
# `repo@sha256:<hex>` form.

crds:
  migration:
    image:
      defaultRegistry: ""
      registry: ""
      repository: reg.kyverno.io/kyverno/kyverno-cli@sha256
      tag: "7224ed05508c24419c3df98114c28ba682ad0a940dcdb7b9fdba0a4b6bf943cf"

admissionController:
  replicas: 1
  rbac:
    serviceAccount:
      automountServiceAccountToken: true
  initContainer:
    image:
      defaultRegistry: ""
      registry: ""
      repository: reg.kyverno.io/kyverno/kyvernopre@sha256
      tag: "cd8cb4a31d25b3992734fb8f24a90ef691c90ce49338c89bea96792160eacb98"
    pullPolicy: IfNotPresent
    resources:
      limits:
        cpu: 100m
        memory: 256Mi
      requests:
        cpu: 10m
        memory: 64Mi
    securityContext:
      runAsNonRoot: true
      privileged: false
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
  container:
    image:
      defaultRegistry: ""
      registry: ""
      repository: reg.kyverno.io/kyverno/kyverno@sha256
      tag: "0a540e2ddf74d0d2d3d45f9ef248d7dbc96576accdbcc6a2dd7eaff9fea56504"
    pullPolicy: IfNotPresent
    resources:
      limits:
        memory: 384Mi
      requests:
        cpu: 100m
        memory: 128Mi
    securityContext:
      runAsNonRoot: true
      privileged: false
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault

