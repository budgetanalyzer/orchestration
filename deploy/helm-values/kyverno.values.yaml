# Shared local and production-reference Kyverno values retained for
# provider-neutral chart rendering, policy validation, and image evidence.
# Keep this file explicit and reviewable instead of relying on chart defaults for
# controller replica counts, token automount, and runtime hardening.
#
# Chart 3.9.1 does not expose first-class digest fields for the Kyverno
# images. The helper always renders `repository:tag`, so immutable refs are
# encoded here as `repository@sha256` plus `tag=<64 hex>` to render the final
# `repo@sha256:<hex>` form.

crds:
  migration:
    image:
      defaultRegistry: ""
      registry: ""
      repository: reg.kyverno.io/kyverno/kyverno-cli@sha256
      tag: "ced7b2be0b04250cabfe695f15307f69eb715fe23234816388af4f3812915b2a"

admissionController:
  replicas: 1
  rbac:
    serviceAccount:
      automountServiceAccountToken: true
  initContainer:
    image:
      defaultRegistry: ""
      registry: ""
      repository: reg.kyverno.io/kyverno/kyvernopre@sha256
      tag: "c25c47461f06f2845a48c319ae86fbbc1730a7b9ed5b701889c9dc1f9ee94b09"
    pullPolicy: IfNotPresent
    resources:
      limits:
        cpu: 100m
        memory: 256Mi
      requests:
        cpu: 10m
        memory: 64Mi
    securityContext:
      runAsNonRoot: true
      privileged: false
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
  container:
    image:
      defaultRegistry: ""
      registry: ""
      repository: reg.kyverno.io/kyverno/kyverno@sha256
      tag: "b31d8511ae5fd6010e2a01ea72ebae08eb82fa51d91af14a1d9fe989949b4edb"
    pullPolicy: IfNotPresent
    resources:
      limits:
        memory: 384Mi
      requests:
        cpu: 100m
        memory: 128Mi
    securityContext:
      runAsNonRoot: true
      privileged: false
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault

