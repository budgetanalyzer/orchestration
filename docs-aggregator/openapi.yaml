    PreviewTransactionResponse:
      type: object
      description: Previewed transaction data before import
      properties:
        date:
          type: string
          format: date
          description: Date of the transaction
          example: '2024-04-12'
        description:
          type: string
          description: Description of the transaction
          example: 'TAQUERIA DEL SOL #3'
        amount:
          type: number
          description: Amount of the transaction
          example: 55.12
        type:
          type: string
          description: Type of the transaction
          enum:
            - CREDIT
            - DEBIT
          example: DEBIT
        category:
          type: string
          description: Category extracted from source data
          example: Dining
        bankName:
          type: string
          description: Name of the bank
          example: Capital One
        currencyIsoCode:
          type: string
          description: ISO currency code
          example: USD
        accountId:
          type: string
          description: Account identifier. This value is included in the preview row
            but is not used for duplicate detection.
          example: checking-12345
        duplicate:
          type: boolean
          description: Whether this row appears to duplicate an existing active transaction
            or a row from a completed earlier source file after strict financial identity
            matching plus normalized description equality. Rows within this source
            file are not compared with each other.
          example: false
        duplicateReason:
          type: string
          description: Reason this row was marked as a duplicate. Omitted when duplicate
            is false.
          enum:
            - EXISTING_TRANSACTION
            - IN_BATCH
