    BatchImportTransactionRequest:
      type: object
      description: Transaction data submitted for batch import
      properties:
        date:
          type: string
          format: date
          description: Date of the transaction
          example: '2024-04-12'
        description:
          type: string
          description: Description of the transaction
          example: 'TAQUERIA DEL SOL #3'
          minLength: 1
        amount:
          type: number
          description: Amount of the transaction
          example: 55.12
        type:
          type: string
          description: Type of the transaction
