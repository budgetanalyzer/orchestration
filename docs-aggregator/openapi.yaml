openapi: 3.1.0
info:
  title: Budget Analyzer - Unified API
  version: '1.0'
  description: 'Unified API documentation for all Budget Analyzer microservices. This
    specification combines the Transaction Service, Currency Service, and Permission
    Service into a single document for client code generation.


    All endpoints are served under the `/api` base path.'
  contact:
    name: Bleu Rubin
    email: contact@budgetanalyzer.org
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: https://app.budgetanalyzer.localhost/api
    description: Local environment (via gateway)
  - url: https://api.budgetanalyzer.org
    description: Production environment
tags:
  - name: Saved Views
    description: Create and manage static transaction collections
    x-service: transaction-service
  - name: Statement Formats
    description: Manage statement format configurations for imports
    x-service: transaction-service
  - name: Transactions
    description: Import and manipulate transactions
    x-service: transaction-service
  - name: Currency Series
    description: Endpoints for querying, creating, and updating currency series
    x-service: currency-service
  - name: Exchange Rates
    description: Endpoints for querying and importing exchange rates
    x-service: currency-service
  - name: User Administration
    description: User administration operations
    x-service: permission-service
paths:
  /v1/statement-formats/{id}:
    get:
      tags:
        - Statement Formats
      summary: Get statement format details
      description: Returns details of a specific statement format by ID.
      operationId: getFormat
      parameters:
        - name: id
          in: path
          description: Statement format ID
          required: true
          schema:
            type: integer
            format: int64
          example: 123
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementFormatResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                type: NOT_FOUND
                message: Not Found
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                type: INTERNAL_ERROR
                message: Internal Server Error
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                type: SERVICE_UNAVAILABLE
                message: Service Unavailable
    put:
      tags:
        - Statement Formats
      summary: Update a statement format
      description: Updates an existing statement format. Only provided fields will
        be updated. The ID, scope, owner, and format type cannot be changed after
        creation.
      operationId: updateFormat
      parameters:
        - name: id
          in: path
          description: Statement format ID
          required: true
          schema:
            type: integer
            format: int64
          example: 123
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStatementFormatRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementFormatResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                type: NOT_FOUND
                message: Not Found
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                type: INVALID_REQUEST
                message: Bad Request
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                type: INTERNAL_ERROR
                message: Internal Server Error
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                type: SERVICE_UNAVAILABLE
                message: Service Unavailable
  /v1/views:
    get:
      tags:
        - Saved Views
      summary: List static saved views
      operationId: listViews
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SavedViewResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                type: INTERNAL_ERROR
                message: Internal Server Error
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                type: SERVICE_UNAVAILABLE
                message: Service Unavailable
    post:
      tags:
        - Saved Views
      summary: Create a static saved view
      operationId: createView
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSavedViewRequest'
        required: true
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: Canonical URL of the created saved view
              style: simple
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedViewResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                type: INVALID_REQUEST
                message: Bad Request
        '422':
          description: SAVED_VIEW_MEMBERSHIP_STALE for unavailable membership or SAVED_VIEW_MEMBERSHIP_LIMIT_EXCEEDED
            when the membership limit is exceeded or SAVED_VIEW_NAME_ALREADY_EXISTS
            for a same-owner name conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                type: INTERNAL_ERROR
                message: Internal Server Error
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                type: SERVICE_UNAVAILABLE
                message: Service Unavailable
  /v1/views/{sourceViewId}/clone:
    post:
      tags:
        - Saved Views
      summary: Clone a static saved view
      description: Creates an independent copy of an owner-scoped saved view under
        a new name
      operationId: cloneView
      parameters:
        - name: sourceViewId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloneSavedViewRequest'
        required: true
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: Canonical URL of the cloned saved view
              style: simple
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedViewResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                type: INVALID_REQUEST
                message: Bad Request
        '404':
          description: Source saved view not found for the authenticated owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: SAVED_VIEW_MEMBERSHIP_STALE when the source membership is unavailable
            or SAVED_VIEW_NAME_ALREADY_EXISTS for a same-owner target name conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                type: INTERNAL_ERROR
                message: Internal Server Error
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                type: SERVICE_UNAVAILABLE
                message: Service Unavailable
  /v1/transactions/preview:
    post:
      tags:
        - Transactions
      summary: Preview transactions from ordered files before import
      description: Parses one or more ordered CSV or PDF files using one shared statement
        format and returns one result and preview token per file for review before
        batch import. No data is persisted. Processing stops at the first failed file
        and returns no partial preview response. The response includes advisory duplicate
        metadata using strict owner-scoped financial identity fields plus normalized
        description equality against existing transactions or completed earlier files,
        plus per-file import history status for exact reuploads by the authenticated
        user. Repeated rows within one file are not compared with each other.
      operationId: previewTransactions
      parameters:
        - name: statementFormatId
          in: query
          description: Statement format ID selected from GET /v1/statement-formats.
            Use GET /v1/statement-formats to list available formats.
          required: true
          schema:
            type: integer
            format: int64
          example: 123
        - name: accountId
          in: query
          description: Account ID to pre-fill for transactions from every file
          required: false
          schema:
            type: string
          example: checking-12345
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  description: Ordered CSV or PDF files to preview. Repeat the files
                    multipart part for each source.
                  items:
                    type: string
                    format: binary
                  minItems: 1
              required:
                - files
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewResponse'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                Format Not Supported:
                  summary: Invalid statement format selection
                  description: Format Not Supported
                  value:
                    type: APPLICATION_ERROR
                    message: 'Statement format has no supported parser revision: 999'
                    code: FORMAT_NOT_SUPPORTED
                Parsing Error:
                  summary: Missing required column in the second file
                  description: Parsing Error
                  value:
                    type: APPLICATION_ERROR
                    message: 'Failed to preview file ''may.csv'': Missing value for
                      required column ''Description'' at line 1'
                    code: CSV_PARSING_ERROR
                Missing Original Filename:
                  summary: Multipart file part omitted the filename parameter
                  description: Missing Original Filename
                  value:
                    type: APPLICATION_ERROR
                    message: Uploaded file part at index 0 must include an original
                      filename.
                    code: MISSING_ORIGINAL_FILENAME
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                type: INVALID_REQUEST
                message: Bad Request
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                type: INTERNAL_ERROR
                message: Internal Server Error
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                type: SERVICE_UNAVAILABLE
                message: Service Unavailable
  /v1/transactions/bulk-delete:
    post:
      tags:
        - Transactions
      summary: Bulk delete transactions
      description: Soft-deletes multiple transactions in a single operation. Returns
        the count of successfully deleted transactions and any IDs that were not found
        or already deleted.
      operationId: bulkDeleteTransactions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkDeleteRequest'
        required: true
      responses:
        '200':
          description: Some transactions not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkDeleteResponse'
              examples:
                Partial success:
                  summary: Some IDs not found
                  description: Partial success
                  value:
                    deletedCount: 2
                    notFoundIds:
                      - 999
                      - 1000
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                type: INVALID_REQUEST
                message: Bad Request
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                type: INTERNAL_ERROR
                message: Internal Server Error
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                type: SERVICE_UNAVAILABLE
                message: Service Unavailable
  /v1/transactions/batch:
    post:
      tags:
        - Transactions
      summary: Import a batch of transactions
      description: Imports one ordered group of reviewed source files from the preview
        endpoint. Every previewImportToken is verified for the authenticated owner
        before the persistence service is called. Verified tokens must share one statement
        format and account, but may use different parser revisions. All rows are validated
        before database work, and every accepted file group is persisted atomically.
        Duplicate filtering uses strict owner-scoped financial identity fields plus
        normalized description equality against persisted rows and completed earlier
        files. Rows within their own file are not compared. Duplicates are skipped
        unless allowDuplicate is true. Each source that creates rows creates or reuses
        separate file provenance; a zero-created source creates none. Transaction
        and newly created provenance writes roll back together on failure. The response
        reports aggregate and ordered per-file counts, including duplicates intentionally
        imported, and created rows. If duplicate filtering leaves no rows to create
        across all files, the request fails with BATCH_IMPORT_NO_TRANSACTIONS_CREATED.
      operationId: batchImportTransactions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchImportRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchImportResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                type: INVALID_REQUEST
                message: Bad Request
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                No Transactions Created:
                  summary: All rows were skipped as duplicates
                  description: No Transactions Created
                  value:
                    type: APPLICATION_ERROR
                    message: All submitted rows were skipped as duplicates.
                    code: BATCH_IMPORT_NO_TRANSACTIONS_CREATED
                Source Identity Mismatch:
                  summary: Verified tokens identify different formats or accounts
                  description: Source Identity Mismatch
                  value:
                    type: APPLICATION_ERROR
                    message: Preview import token sources do not match.
                    code: BATCH_IMPORT_SOURCE_MISMATCH
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                type: INTERNAL_ERROR
                message: Internal Server Error
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                type: SERVICE_UNAVAILABLE
                message: Service Unavailable
  /v1/statement-formats:
    get:
      tags:
        - Statement Formats
      summary: List all statement formats
      description: Returns statement formats visible to the caller. Formats hidden
        by the current user are excluded by default; pass includeHidden=true for management
        screens.
      operationId: listFormats
      parameters:
        - name: includeHidden
          in: query
          description: Include formats hidden by the current user
          required: false
          schema:
            type: boolean
            default: false
          example: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StatementFormatResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                type: INTERNAL_ERROR
                message: Internal Server Error
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                type: SERVICE_UNAVAILABLE
                message: Service Unavailable
    post:
      tags:
        - Statement Formats
      summary: Create a new statement format
      description: Creates a new statement format configuration. For CSV formats,
        the column header fields (dateHeader, descriptionHeader, creditHeader) are
        required.
      operationId: createFormat
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStatementFormatRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementFormatResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                type: INVALID_REQUEST
                message: Bad Request
        '422':
          description: Business rule violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                type: INTERNAL_ERROR
                message: Internal Server Error
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                type: SERVICE_UNAVAILABLE
                message: Service Unavailable
  /v1/statement-formats/{id}/unhide:
    post:
      tags:
        - Statement Formats
      summary: Unhide a statement format
      description: Restores a statement format to the current user's normal import
        selection lists. The operation is idempotent.
      operationId: unhideFormat
      parameters:
        - name: id
          in: path
          description: Statement format ID
          required: true
          schema:
            type: integer
            format: int64
          example: 123
      responses:
        '204':
          description: Statement format unhidden
        '404':
          description: Statement format not found or not visible to the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                type: INVALID_REQUEST
                message: Bad Request
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                type: INTERNAL_ERROR
                message: Internal Server Error
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                type: SERVICE_UNAVAILABLE
                message: Service Unavailable
  /v1/statement-formats/{id}/hide:
    post:
      tags:
        - Statement Formats
      summary: Hide a statement format
      description: Hides a statement format from the current user's normal import
        selection lists. The operation is idempotent and does not disable the format
        for other users.
      operationId: hideFormat
      parameters:
        - name: id
          in: path
          description: Statement format ID
          required: true
          schema:
            type: integer
            format: int64
          example: 123
      responses:
        '204':
          description: Statement format hidden
        '404':
          description: Statement format not found or not visible to the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                type: INVALID_REQUEST
                message: Bad Request
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                type: INTERNAL_ERROR
                message: Internal Server Error
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                type: SERVICE_UNAVAILABLE
                message: Service Unavailable
  /v1/statement-formats/pdf-wizard/save:
    post:
      tags:
        - Statement Formats
      summary: Save a PDF wizard statement format
      description: Validates the confirmed text-PDF table mapping against the sample
        PDF and creates a user-scoped PDF statement format with one enabled PDF_TEXT_TABLE_CONFIG
        parser revision.
      operationId: savePdfWizardFormat
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                request:
                  $ref: '#/components/schemas/PdfWizardSaveRequest'
              required:
                - file
                - request
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementFormatResponse'
        '422':
          description: Mapping validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                type: INVALID_REQUEST
                message: Bad Request
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                type: INTERNAL_ERROR
                message: Internal Server Error
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                type: SERVICE_UNAVAILABLE
                message: Service Unavailable
  /v1/statement-formats/pdf-wizard/preview:
    post:
      tags:
        - Statement Formats
      summary: Preview a PDF wizard mapping
      description: Parses read-only transaction preview rows from a multipart text-PDF
        sample and confirmed table mapping. This does not create a statement format,
        preview token, file import, or transactions.
      operationId: previewPdfMapping
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                request:
                  $ref: '#/components/schemas/PdfWizardMappingPreviewRequest'
              required:
                - file
                - request
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PdfWizardPreviewResponse'
        '422':
          description: Mapping validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                type: INVALID_REQUEST
                message: Bad Request
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                type: INTERNAL_ERROR
                message: Internal Server Error
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                type: SERVICE_UNAVAILABLE
                message: Service Unavailable
  /v1/statement-formats/pdf-wizard/analyze:
    post:
      tags:
        - Statement Formats
      summary: Analyze a PDF sample for statement format creation
      description: Extracts text from a multipart PDF sample and returns ranked transaction-table
        candidates with inferred mappings, confidence, sample rows, and unsupported-file
        rejection reasons. This does not persist the uploaded file or create import
        state.
      operationId: analyzePdfSample
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PdfWizardAnalysisResponse'
        '422':
          description: PDF parsing or analysis error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                type: INVALID_REQUEST
                message: Bad Request
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                type: INTERNAL_ERROR
                message: Internal Server Error
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                type: SERVICE_UNAVAILABLE
                message: Service Unavailable
  /v1/statement-formats/csv-wizard/save:
    post:
      tags:
        - Statement Formats
      summary: Save a CSV wizard statement format
      description: Validates the confirmed mapping against the sample CSV and creates
        a user-scoped CSV statement format with one enabled CSV_COLUMN_CONFIG parser
        revision.
      operationId: saveCsvWizardFormat
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
