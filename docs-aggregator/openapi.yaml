          type: string
          description: Internal user ID
          example: usr_abc123
        idpSub:
          type: string
          description: Identity provider subject identifier
          example: auth0|67fd70c38eb9d43f1c93ea44
        email:
          type: string
          description: User email address
          example: admin@example.com
        displayName:
          type: string
          description: Display name
          example: Admin User
        status:
          type: string
          description: Current user status
          enum:
            - ACTIVE
            - DEACTIVATED
          example: ACTIVE
        roleIds:
          type: array
          description: Assigned role IDs
          example:
            - ADMIN
          items:
            type: string
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
          example: '2026-04-01T12:00:00Z'
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
          example: '2026-04-08T12:00:00Z'
        deactivatedAt:
          type: string
          format: date-time
          description: Deactivation timestamp
          example: '2026-04-08T12:00:00Z'
    UserDetailResponse:
      type: object
      description: Detailed representation of a user
      properties:
        id:
          type: string
          description: Internal user ID
          example: usr_abc123
        idpSub:
          type: string
          description: Identity provider subject identifier
          example: auth0|67fd70c38eb9d43f1c93ea44
        email:
          type: string
          description: User email address
          example: admin@example.com
        displayName:
          type: string
          description: Display name
          example: Admin User
        status:
          type: string
          description: Current user status
          enum:
            - ACTIVE
            - DEACTIVATED
          example: ACTIVE
        roleIds:
          type: array
          description: Assigned role IDs
          example:
            - ADMIN
          items:
            type: string
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
          example: '2026-04-01T12:00:00Z'
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
