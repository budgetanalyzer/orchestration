  /v1/transactions/search:
    get:
      tags:
        - Transactions
      summary: Search transactions across users
      description: Returns a paged administrative search across active transactions.
        minAmount and maxAmount compare each row's stored numeric amount without currency
        normalization, so an amount-only query may match multiple currencies. currencyIsoCode
        is an independent exact criterion; combine it with amount bounds for a currency-specific
        numeric comparison. Sorting by amount likewise uses the stored numeric amount.
      operationId: searchTransactions
      parameters:
        - name: sort
          in: query
          description: Sorting criteria as property,(asc|desc). Multiple values are
            supported. sort=amount compares stored numeric amounts without currency
            normalization.
          required: false
          schema:
            type: array
            default:
              - date,DESC
              - id,DESC
            items:
              type: string
        - name: id
          in: query
          description: Unique identifier for the transaction
          required: false
          schema:
            type: integer
            format: int64
            description: Unique identifier for the transaction
            example: 1
          example: 1
        - name: ownerId
          in: query
          description: ID of the user who owns the transaction. Only effective on
            admin endpoints; ignored on user-scoped endpoints where the authenticated
            user is always applied.
          required: false
          schema:
            type: string
            description: ID of the user who owns the transaction. Only effective on
              admin endpoints; ignored on user-scoped endpoints where the authenticated
              user is always applied.
            example: usr_test123
          example: usr_test123
        - name: accountId
          in: query
          description: Identifier for the account associated with the transaction
          required: false
          schema:
            type: string
            description: Identifier for the account associated with the transaction
            example: checking-3223
          example: checking-3223
        - name: bankName
          in: query
          description: Name of the bank where the transaction occurred
          required: false
          schema:
            type: string
            description: Name of the bank where the transaction occurred
            example: Capital One
          example: Capital One
        - name: dateFrom
          in: query
          description: Start date for transaction date range
          required: false
          schema:
            type: string
            format: date
            description: Start date for transaction date range
            example: '2025-10-01'
          example: '2025-10-01'
        - name: dateTo
          in: query
          description: End date for transaction date range
          required: false
          schema:
            type: string
            format: date
            description: End date for transaction date range
            example: '2025-10-14'
          example: '2025-10-14'
        - name: currencyIsoCode
          in: query
          description: Exact ISO currency code criterion. On administrative endpoints
            this is independent of minAmount and maxAmount; combine them to make an
            amount comparison currency-specific.
          required: false
          schema:
            type: string
            description: Exact ISO currency code criterion. On administrative endpoints
              this is independent of minAmount and maxAmount; combine them to make
              an amount comparison currency-specific.
            example: USD
          example: USD
        - name: minAmount
          in: query
          description: Inclusive minimum stored numeric amount. Administrative search
            and count do not normalize currencies, so this criterion is valid across
            currencies.
          required: false
          schema:
            type: number
            description: Inclusive minimum stored numeric amount. Administrative search
              and count do not normalize currencies, so this criterion is valid across
              currencies.
            example: 10.0
          example: 10.0
        - name: maxAmount
          in: query
          description: Inclusive maximum stored numeric amount. Administrative search
            and count do not normalize currencies, so this criterion is valid across
            currencies.
          required: false
          schema:
            type: number
            description: Inclusive maximum stored numeric amount. Administrative search
              and count do not normalize currencies, so this criterion is valid across
              currencies.
            example: 500.0
          example: 500.0
        - name: type
          in: query
          description: Type of the transaction
          required: false
          schema:
            type: string
            description: Type of the transaction
            enum:
              - CREDIT
              - DEBIT
              - CREDIT
              - DEBIT
            example: DEBIT
          example: DEBIT
        - name: description
          in: query
          description: Text to match in the transaction description
          required: false
          schema:
            type: string
            description: Text to match in the transaction description
            example: Grocery
          example: Grocery
        - name: createdAfter
          in: query
          description: Start of creation timestamp range
          required: false
          schema:
            type: string
            format: date-time
            description: Start of creation timestamp range
            example: '2025-10-14T00:00:00Z'
          example: '2025-10-14T00:00:00Z'
        - name: createdBefore
          in: query
          description: End of creation timestamp range
          required: false
          schema:
            type: string
            format: date-time
            description: End of creation timestamp range
            example: '2025-10-15T00:00:00Z'
          example: '2025-10-15T00:00:00Z'
        - name: updatedAfter
          in: query
          description: Start of last update timestamp range
          required: false
          schema:
            type: string
            format: date-time
            description: Start of last update timestamp range
            example: '2025-10-14T00:00:00Z'
          example: '2025-10-14T00:00:00Z'
        - name: updatedBefore
          in: query
          description: End of last update timestamp range
          required: false
          schema:
            type: string
            format: date-time
            description: End of last update timestamp range
            example: '2025-10-15T00:00:00Z'
          example: '2025-10-15T00:00:00Z'
        - name: page
          in: query
          description: Zero-based page index (0..N)
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          description: The size of the page to be returned
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
      responses:
        '200':
          description: Transactions retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResponseTransactionResponse'
        '400':
          description: Bad Request
          content:
