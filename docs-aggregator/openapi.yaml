components:
  schemas:
    UpdateStatementFormatRequest:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 100
          minLength: 0
        bankName:
          type: string
          maxLength: 100
          minLength: 0
        defaultCurrencyIsoCode:
          type: string
          maxLength: 3
          minLength: 3
        enabled:
          type: boolean
    StatementFormatResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        displayName:
          type: string
        formatType:
          type: string
          enum:
            - CSV
            - PDF
            - XLSX
        bankName:
          type: string
        defaultCurrencyIsoCode:
          type: string
        scope:
          type: string
          enum:
            - SYSTEM
            - USER
        ownerId:
          type: string
        enabled:
          type: boolean
        hidden:
          type: boolean
          description: Whether the current user has hidden this format from normal
            import selection
          example: false
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the statement format was created
          example: '2026-04-08T10:30:00Z'
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the statement format was last updated
          example: '2026-04-08T10:45:00Z'
        createdBy:
          type: string
          description: User ID that created this statement format
          example: usr_admin123
        updatedBy:
          type: string
          description: User ID that last updated this statement format
          example: usr_admin456
      required:
        - createdAt
    ApiErrorResponse:
      description: Standard API error response format
      properties:
        type:
          type: string
          description: Error type categorization for API responses
          enum:
            - INVALID_REQUEST
            - VALIDATION_ERROR
            - NOT_FOUND
            - APPLICATION_ERROR
            - SERVICE_UNAVAILABLE
            - INTERNAL_ERROR
            - UNAUTHORIZED
            - FORBIDDEN
          example: APPLICATION_ERROR
        message:
          type: string
          description: Human-readable message describing the error
          example: 'CSV format: fake-bank not supported'
        code:
          type: string
          description: Machine-readable error code for specific application errors
            (required for APPLICATION_ERROR type)
          example: CSV_PARSING_ERROR
        fieldErrors:
          type: array
          description: List of field-level validation errors (populated for VALIDATION_ERROR
            type)
          items:
            $ref: '#/components/schemas/FieldError'
      required:
        - message
        - type
    FieldError:
      description: Field-level validation error details
      properties:
        index:
          type: integer
          format: int32
          description: Zero-based index of the item in a batch/list that caused the
            error. Null for single-item validation errors.
          example: 44
        field:
          type: string
          description: Field that triggered the error
          example: email
        message:
          type: string
          description: Error message
          example: must be a valid email address
        rejectedValue:
          type: object
          description: Value that caused the error
          example: invalid@email
      required:
        - field
        - message
    CreateSavedViewRequest:
      type: object
      description: Request to create a new saved view
      properties:
        name:
          type: string
          description: Name of the saved view
          example: SF Trip December 2024
          maxLength: 255
          minLength: 0
        transactionIds:
          type: array
          description: Unordered transaction IDs to include in the static view
          items:
            type: integer
            format: int64
            minimum: 1
          maxItems: 10000
      required:
        - name
        - transactionIds
    SavedViewResponse:
      type: object
      description: Static saved-view metadata
      properties:
        id:
          type: string
          format: uuid
          description: Unique view identifier
        name:
          type: string
          description: User-facing view name
          example: SF Trip December 2024
        transactionCount:
          type: integer
          format: int64
          description: Number of active transaction memberships
          example: 25
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Last explicit update timestamp
      required:
        - createdAt
        - id
        - name
        - transactionCount
        - updatedAt
    CloneSavedViewRequest:
      type: object
      description: Request to clone a saved view
      properties:
        name:
          type: string
          description: Name for the cloned view
          example: Copy of December review
          maxLength: 255
          minLength: 0
      required:
        - name
    PreviewFileImportStatusResponse:
      type: object
      description: File import history status for the previewed upload
      properties:
        alreadyImported:
          type: boolean
          description: Whether the current user has already imported the exact same
            file bytes
          example: false
        warningCode:
          type: string
          description: Stable warning code for file-level preview status. Omitted
            when there is no warning.
          enum:
            - FILE_ALREADY_IMPORTED
          example: FILE_ALREADY_IMPORTED
        previousImport:
          $ref: '#/components/schemas/PreviousFileImportResponse'
          description: Previous matching import metadata. Omitted when alreadyImported
            is false.
      required:
        - alreadyImported
    PreviewFileResponse:
      type: object
      description: Preview result for one uploaded source file
      properties:
        sourceFile:
          type: string
          description: Original filename of the uploaded file
          example: cap-one-2024.csv
        statementFormatId:
          type: integer
          format: int64
          description: Statement format ID used for parsing
          example: 123
        previewImportToken:
          type: string
          description: Opaque encrypted source-file token required for token-backed
            batch import
          example: v2.dGVzdGl2MTIzNDU.Kc4WwTqfh1sFD8pxVq7Hxg
        fileImport:
          $ref: '#/components/schemas/PreviewFileImportStatusResponse'
          description: File-level import history status for the uploaded bytes and
            authenticated user
        transactions:
          type: array
          description: Extracted transactions ready for review, including advisory
            duplicate metadata
          items:
            $ref: '#/components/schemas/PreviewTransactionResponse'
      required:
        - fileImport
        - previewImportToken
        - sourceFile
        - statementFormatId
        - transactions
    PreviewResponse:
      type: object
      description: Grouped response from an ordered multi-file transaction preview
      properties:
        files:
          type: array
          description: Ordered preview result for every uploaded source file
          items:
