apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app-route
  namespace: default
spec:
  parentRefs:
  - name: istio-ingress-gateway
    namespace: istio-ingress
  hostnames:
  - "app.budgetanalyzer.localhost"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api-docs
    filters:
    - type: RequestHeaderModifier
      requestHeaderModifier:
        remove:
        - Forwarded
        - X-Forwarded-Host
        - X-Forwarded-Port
        - X-Forwarded-Prefix
        - X-Forwarded-Ssl
        set:
        - name: X-Forwarded-Proto
          value: "https"
    - type: ResponseHeaderModifier
      responseHeaderModifier:
        set:
        - name: Strict-Transport-Security
          value: "max-age=31536000"
    backendRefs:
    - name: nginx-gateway
      port: 8080
  - filters:
    - type: RequestHeaderModifier
      requestHeaderModifier:
        remove:
        - Forwarded
        - X-Forwarded-Host
        - X-Forwarded-Port
        - X-Forwarded-Prefix
        - X-Forwarded-Ssl
        set:
        - name: X-Forwarded-Proto
          value: "https"
    - type: ResponseHeaderModifier
      responseHeaderModifier:
        set:
        - name: Strict-Transport-Security
          value: "max-age=31536000"
    backendRefs:
    - name: nginx-gateway
      port: 8080
