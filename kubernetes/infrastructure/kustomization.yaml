apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: infrastructure

resources:
  - namespace.yaml
  - postgresql/configmap.yaml
  - postgresql/hba-configmap.yaml
  - postgresql/service.yaml
  - postgresql/statefulset.yaml
  - rabbitmq/configmap.yaml
  - rabbitmq/service.yaml
  - rabbitmq/statefulset.yaml
  - redis-cache/service.yaml
  - redis-cache/deployment.yaml
  - redis-session/service.yaml
  - redis-session/statefulset.yaml

configMapGenerator:
  - name: redis-cache-acl-bootstrap
    files:
      - start-redis.sh=redis-cache/start-redis.sh
  - name: redis-session-acl-bootstrap
    files:
      - start-redis.sh=redis-session/start-redis.sh

generatorOptions:
  disableNameSuffixHash: true
