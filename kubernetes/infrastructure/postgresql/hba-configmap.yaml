apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-hba
  namespace: infrastructure
  labels:
    app: postgresql
data:
  # Loaded through `-c hba_file=...` so it also governs existing data volumes.
  # There are no `host` rules: TCP clients without TLS get no pg_hba.conf entry.
  pg_hba.conf: |
    # TYPE   DATABASE  USER  ADDRESS    METHOD
    local    all       all              scram-sha-256
    hostssl  all       all   0.0.0.0/0  scram-sha-256
    hostssl  all       all   ::/0       scram-sha-256
