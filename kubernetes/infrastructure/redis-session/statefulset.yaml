apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-session
  namespace: infrastructure
  labels:
    app: redis-session
spec:
  serviceName: redis-session
  replicas: 1
  selector:
    matchLabels:
      app: redis-session
  template:
    metadata:
      labels:
        app: redis-session
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis-session
          image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
          ports:
            - name: redis-session
              containerPort: 6379
          command:
            - /bin/sh
            - /opt/redis/start-redis.sh
          env:
            - name: REDIS_SESSION_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-session-bootstrap-credentials
                  key: default-password
            - name: REDIS_SESSION_GATEWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-session-bootstrap-credentials
                  key: session-gateway-password
            - name: REDIS_EXT_AUTHZ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-session-bootstrap-credentials
                  key: ext-authz-password
            - name: REDIS_SESSION_OPS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-session-bootstrap-credentials
                  key: ops-password
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: redis-session-bootstrap-credentials
                  key: default-password
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 999
          volumeMounts:
            - name: redis-session-acl-bootstrap
              mountPath: /opt/redis
              readOnly: true
            - name: redis-session-tmp
              mountPath: /tmp
            - name: redis-data
              mountPath: /data
            - name: redis-session-tls
              mountPath: /tls
              readOnly: true
            - name: redis-session-ca
              mountPath: /tls-ca
              readOnly: true
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 300m
          livenessProbe:
            exec:
              command:
                - redis-cli
                - --tls
                - --cacert
                - /tls-ca/ca.crt
                - ping
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command:
                - redis-cli
                - --tls
                - --cacert
                - /tls-ca/ca.crt
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: redis-session-acl-bootstrap
          configMap:
            name: redis-session-acl-bootstrap
            defaultMode: 0555
        - name: redis-session-tmp
          emptyDir: {}
        - name: redis-session-tls
          secret:
            secretName: infra-tls-redis-session
        - name: redis-session-ca
          secret:
            secretName: infra-ca
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
