# ============================================================================
# Authorization Policies for service-to-service traffic
# ============================================================================
#
# With Istio-managed ingress, the ingress gateway has a SPIFFE
# identity and participates in mesh mTLS. All services — both ingress-facing
# and internal — now have AuthorizationPolicies restricting their callers.
#
# Ingress-facing services (nginx-gateway, ext-authz, session-gateway) accept
# traffic only from the Istio ingress gateway identity, and session-gateway
# only on its public auth-route paths.
# Internal backend services accept nginx-gateway only on the exact upstream
# paths the NGINX API locations rewrite to. Each resource prefix has an exact
# entry and a "/*" entry; never use a version-wide wildcard such as
# /<service>/v1/*. A new public resource needs its mesh path here as well as
# its NGINX location (see nginx/README.md); without it the route fails closed
# with 403.
#
# The sidecar normalizes the request path before these rules match, so a
# traversal such as /permission-service/v1/users/..;/..;/internal/... is
# evaluated as /permission-service/internal/... and denied.
#
# default-deny-all makes deny-by-default explicit: a workload in default is
# reachable only through an ALLOW rule that selects it.
# ============================================================================

apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: default-deny-all
  namespace: default
spec: {}
---
# transaction-service: nginx-gateway on the public transaction, statement
# format, and saved view resources plus the exact OpenAPI route.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: transaction-service-policy
  namespace: default
spec:
  selector:
    matchLabels:
      app: transaction-service
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/default/sa/nginx-gateway"]
      to:
        - operation:
            paths:
              - "/transaction-service/v1/transactions"
              - "/transaction-service/v1/transactions/*"
              - "/transaction-service/v1/statement-formats"
              - "/transaction-service/v1/statement-formats/*"
              - "/transaction-service/v1/views"
              - "/transaction-service/v1/views/*"
              - "/transaction-service/v3/api-docs"
---
# currency-service: nginx-gateway on the public currency and exchange-rate
# resources plus the exact OpenAPI route.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: currency-service-policy
  namespace: default
spec:
  selector:
    matchLabels:
      app: currency-service
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/default/sa/nginx-gateway"]
      to:
        - operation:
            paths:
              - "/currency-service/v1/currencies"
              - "/currency-service/v1/currencies/*"
              - "/currency-service/v1/exchange-rates"
              - "/currency-service/v1/exchange-rates/*"
              - "/currency-service/v3/api-docs"
---
# permission-service: nginx-gateway on the public user administration
# resource; session-gateway GET on the two internal lookups it makes during
# session creation and heartbeat refresh.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: permission-service-policy
  namespace: default
spec:
  selector:
    matchLabels:
      app: permission-service
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/default/sa/nginx-gateway"]
      to:
        - operation:
            paths:
              - "/permission-service/v1/users"
              - "/permission-service/v1/users/*"
    - from:
        - source:
            principals: ["cluster.local/ns/default/sa/session-gateway"]
      to:
        - operation:
            methods: ["GET"]
            paths:
              - "/permission-service/internal/v1/users/{*}/permissions"
              - "/permission-service/internal/v1/users/{*}/authorization"
---
# budget-analyzer-web: accepts from nginx-gateway (proxied by nginx).
# This policy is local/Tilt-only because the production reference serves the
# frontend bundle from nginx-gateway instead of running a standalone
# budget-analyzer-web Deployment. The production Kustomize overlay deletes
# only this resource from the shared policy source.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: budget-analyzer-web-policy
  namespace: default
spec:
  selector:
    matchLabels:
      app: budget-analyzer-web
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/default/sa/nginx-gateway"]
---
# Prometheus: allow the meshed Prometheus pod in monitoring to scrape
# Envoy sidecar metrics from default-namespace workloads.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: spring-boot-metrics-prometheus-policy
  namespace: default
spec:
  selector:
    matchLabels:
      app.kubernetes.io/framework: spring-boot
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/monitoring/sa/prometheus-stack-kube-prom-prometheus"
      to:
        - operation:
            methods: ["GET"]
            ports: ["8081"]
            paths: ["/actuator/prometheus"]
        - operation:
            methods: ["GET"]
            ports: ["8082"]
            paths: ["/transaction-service/actuator/prometheus"]
        - operation:
            methods: ["GET"]
            ports: ["8084"]
            paths: ["/currency-service/actuator/prometheus"]
        - operation:
            methods: ["GET"]
            ports: ["8086"]
            paths: ["/permission-service/actuator/prometheus"]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: envoy-metrics-prometheus-policy
  namespace: default
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/monitoring/sa/prometheus-stack-kube-prom-prometheus"
      to:
        - operation:
            ports: ["15090"]
---
# ============================================================================
# Ingress-facing services: accept from Istio ingress gateway only
# ============================================================================
# The Istio ingress gateway runs in istio-ingress namespace as
# ServiceAccount istio-ingress-gateway-istio, giving it the SPIFFE identity
# below. These policies close the security seam that existed when Envoy
# Gateway was outside the mesh.
# ============================================================================

# nginx-gateway: accepts from istio ingress gateway only
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: nginx-gateway-policy
  namespace: default
spec:
  selector:
    matchLabels:
      app: nginx-gateway
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/istio-ingress/sa/istio-ingress-gateway-istio"]
---
# ext-authz: accepts from istio ingress gateway only
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: ext-authz-policy
  namespace: default
spec:
  selector:
    matchLabels:
      app: ext-authz
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/istio-ingress/sa/istio-ingress-gateway-istio"]
---
# session-gateway: accepts the istio ingress gateway on the auth-route
# surface only, plus the narrow permission-service revocation path used for
# bulk session invalidation
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: session-gateway-policy
  namespace: default
spec:
  selector:
    matchLabels:
      app: session-gateway
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/istio-ingress/sa/istio-ingress-gateway-istio"]
      to:
        - operation:
            paths:
              - "/oauth2/*"
              - "/login/oauth2/*"
              - "/logout"
              - "/logout/*"
              - "/auth/*"
    - from:
        - source:
            principals: ["cluster.local/ns/default/sa/permission-service"]
      to:
        - operation:
            ports: ["8081"]
            methods: ["DELETE"]
            paths: ["/internal/v1/sessions/users/{*}"]
