apiVersion: v1
kind: ConfigMap
metadata:
  name: istio-ingress-gateway-config
  namespace: istio-ingress
data:
  deployment: |
    spec:
      template:
        metadata:
          annotations:
            proxy.istio.io/config: |-
              proxyStatsMatcher:
                inclusionRegexps:
                  - ".*ingress_(login_initiation|login_completion|session_operations|api_requests).*"
        spec:
          securityContext:
            seccompProfile:
              type: RuntimeDefault
  serviceAccount: |
    automountServiceAccountToken: true
