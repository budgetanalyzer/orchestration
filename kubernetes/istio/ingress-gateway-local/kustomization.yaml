apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../ingress-gateway-config.yaml

patches:
  - target:
      version: v1
      kind: ConfigMap
      name: istio-ingress-gateway-config
      namespace: istio-ingress
    patch: |-
      - op: add
        path: /data/service
        value: |-
          spec:
            type: NodePort
            ports:
              - port: 443
                nodePort: 30443
