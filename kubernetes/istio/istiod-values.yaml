pilot:
  cni:
    enabled: true
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
meshConfig:
  enableTracing: true
  defaultConfig:
    tracing: {}
  outboundTrafficPolicy:
    mode: REGISTRY_ONLY
  extensionProviders:
    - name: ext-authz-http
      envoyExtAuthzHttp:
        service: ext-authz.default.svc.cluster.local
        port: 9002
        # Bound every check and report authorizer failures (no response,
        # timeout or authorizer 5xx) as 503 instead of Istio's 403 default.
        # Envoy discards the authorizer body on that path, so the 503 is
        # empty. The timeout comes from the measured check latency in
        # docs/research/security-consensus-hardening-evidence.md.
        timeout: 1s
        statusOnError: "503"
        headersToUpstreamOnAllow:
          - x-user-id
          - x-roles
          - x-permissions
        headersToDownstreamOnDeny:
          - content-type
        includeRequestHeadersInCheck:
          - cookie
        failOpen: false
    - name: jaeger
      opentelemetry:
        service: jaeger-collector.monitoring.svc.cluster.local
        port: 4317
