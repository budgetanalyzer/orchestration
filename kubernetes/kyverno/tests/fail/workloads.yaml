apiVersion: apps/v1
kind: Deployment
metadata:
  name: missing-hardening
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: missing-hardening
  template:
    metadata:
      labels:
        app: missing-hardening
    spec:
      containers:
        - name: app
          image: busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
          command: ["sh", "-c", "sleep 3600"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mutable-third-party-image
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mutable-third-party-image
  template:
    metadata:
      labels:
        app: mutable-third-party-image
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: nginx:1.29.4-alpine
          command: ["sh", "-c", "sleep 3600"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 65534
---
