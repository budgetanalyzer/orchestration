apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-local-workload
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secure-local-workload
  template:
    metadata:
      labels:
        app: secure-local-workload
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: init
          image: busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
          command: ["sh", "-c", "true"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 65534
      containers:
        - name: app
          image: budget-analyzer-web:latest
          imagePullPolicy: Never
          command: ["sh", "-c", "sleep 3600"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 65534
---
