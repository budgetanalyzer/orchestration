    budgetanalyzer.io/cert-manager-http01-solver: "true"
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: solver
      image: quay.io/jetstack/cert-manager-acmesolver:v1.20.4@sha256:bbec214d3935cbbeb3ab88c57ee36e2b2511a0017e48ffc14a999e48fa30d3a2
      command: ["sh", "-c", "sleep 3600"]
