apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../istio/ext-authz-policy.yaml
  - ../../istio/ingress-rate-limit.yaml

patches:
  - target:
      group: networking.istio.io
      version: v1alpha3
      kind: EnvoyFilter
      name: ingress-local-rate-limits
      namespace: istio-ingress
    patch: |-
      - op: replace
        path: /spec/configPatches/0/patch/value/typed_config/value/xds_matcher/matcher_list/matchers/0/predicate/not_matcher/and_matcher/predicate/0/single_predicate/value_match/exact
        value: demo.budgetanalyzer.org
      - op: replace
        path: /spec/configPatches/1/patch/value/typed_config/value/xds_matcher/matcher_list/matchers/0/predicate/not_matcher/and_matcher/predicate/0/single_predicate/value_match/exact
        value: demo.budgetanalyzer.org
      - op: replace
        path: /spec/configPatches/2/patch/value/typed_config/value/xds_matcher/matcher_list/matchers/0/predicate/not_matcher/and_matcher/predicate/0/single_predicate/value_match/exact
        value: demo.budgetanalyzer.org
      - op: replace
        path: /spec/configPatches/3/patch/value/typed_config/value/xds_matcher/matcher_list/matchers/0/predicate/not_matcher/and_matcher/predicate/0/single_predicate/value_match/exact
        value: demo.budgetanalyzer.org
