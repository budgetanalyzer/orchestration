# Shared /api-docs routes for nginx.k8s.conf and nginx.production.k8s.conf.
# Include this file once at server level. NGINX checks regex locations in
# file order, so keep the two regex locations in their current relative order.

# API Documentation
location = /api-docs {
    include includes/security-headers-docs-csp.conf;
    alias /usr/share/nginx/html/docs/index.html;
    default_type text/html;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
}

location ~ ^/api-docs/(swagger-ui\.css|swagger-ui-bundle\.js|swagger-initializer\.js|swagger-ui-overrides\.css)$ {
    include includes/security-headers-docs-csp.conf;
    alias /usr/share/nginx/html/docs/$1;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
}

location = /api-docs/release-metadata.json {
    include includes/security-headers-docs-csp.conf;
    alias /usr/share/nginx/html/docs/release-metadata.json;
    default_type application/json;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
}

# OpenAPI spec files
location ~ ^/api-docs/(openapi\.(json|yaml))$ {
    include includes/security-headers-docs-csp.conf;
    alias /usr/share/nginx/html/docs/$1;
    add_header Content-Disposition 'attachment; filename="$1"';
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
}

location /api-docs/ {
    include includes/security-headers-docs-csp.conf;
    default_type text/plain;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    return 404;
}
