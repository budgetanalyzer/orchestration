# Shared API routes for nginx.k8s.conf and nginx.production.k8s.conf.
# Include this file once at server level. Server-level settings, the
# server-level security headers and location precedence still come from the
# including file.

# Reject a decoded ";" anywhere in the path, for every route in the server.
# $uri is decoded and excludes the query string, so query values keep ";".
# The ingress already denies literal and encoded ";" in the raw path before
# NGINX sees the request; this is the second layer on the NGINX lane.
if ($uri ~ ";") {
    return 400;
}

# Transaction Service OpenAPI spec
location /api/transaction-service/v3/api-docs {
    set $transaction_backend "http://transaction-service.default.svc.cluster.local:8082";
    proxy_pass $transaction_backend/transaction-service/v3/api-docs;
    include includes/backend-headers.conf;
}

# Transaction preview (larger uploads)
location /api/v1/transactions/preview {
    client_max_body_size 25M;

    # Use variable-based proxy_pass for dynamic DNS resolution
    set $transaction_backend "http://transaction-service.default.svc.cluster.local:8082";
    proxy_pass $transaction_backend/transaction-service/v1/transactions/preview$is_args$args;

    include includes/backend-headers.conf;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

# General transactions
location /api/v1/transactions {
    set $transaction_backend "http://transaction-service.default.svc.cluster.local:8082";
    rewrite ^/api/v1/(.*)$ /transaction-service/v1/$1 break;
    proxy_pass $transaction_backend;
    include includes/backend-headers.conf;
}

# Statement formats
location /api/v1/statement-formats {
    set $transaction_backend "http://transaction-service.default.svc.cluster.local:8082";
    rewrite ^/api/v1/(.*)$ /transaction-service/v1/$1 break;
    proxy_pass $transaction_backend;
    include includes/backend-headers.conf;
}

# Views
location /api/v1/views {
    set $transaction_backend "http://transaction-service.default.svc.cluster.local:8082";
    rewrite ^/api/v1/(.*)$ /transaction-service/v1/$1 break;
    proxy_pass $transaction_backend;
    include includes/backend-headers.conf;
}

# Currency Service OpenAPI spec
location /api/currency-service/v3/api-docs {
    set $currency_backend "http://currency-service.default.svc.cluster.local:8084";
    proxy_pass $currency_backend/currency-service/v3/api-docs;
    include includes/backend-headers.conf;
}

# Currency endpoints
location /api/v1/currencies {
    set $currency_backend "http://currency-service.default.svc.cluster.local:8084";
    rewrite ^/api/v1/(.*)$ /currency-service/v1/$1 break;
    proxy_pass $currency_backend;
    include includes/backend-headers.conf;
}

location /api/v1/exchange-rates {
    set $currency_backend "http://currency-service.default.svc.cluster.local:8084";
    rewrite ^/api/v1/(.*)$ /currency-service/v1/$1 break;
    proxy_pass $currency_backend;
    include includes/backend-headers.conf;
}

# Permission Service user administration
location /api/v1/users {
    set $permission_backend "http://permission-service.default.svc.cluster.local:8086";
    rewrite ^/api/v1/(.*)$ /permission-service/v1/$1 break;
    proxy_pass $permission_backend;
    include includes/backend-headers.conf;
}

# Fail closed for API paths that are not owned by a backend route.
# Keep an explicit body so NGINX does not generate its HTML error page.
location = /api {
    default_type text/plain;
    return 404 "Not Found";
}

location /api/ {
    default_type text/plain;
    return 404 "Not Found";
}
