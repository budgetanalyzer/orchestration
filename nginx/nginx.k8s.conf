pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main 'remote_addr=$remote_addr proxy_addr=$realip_remote_addr xff="$http_x_forwarded_for" '
                    'xrealip="$http_x_real_ip" request="$request" '
                    'status=$status body_bytes_sent=$body_bytes_sent';
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    # nginxinc/nginx-unprivileged expects runtime scratch paths under /tmp.
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Kubernetes DNS resolver - enables dynamic upstream resolution
    # This allows NGINX to start even when services aren't available yet
    resolver kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off;
    resolver_timeout 5s;

    # WebSocket upgrade handling
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # ========================================================================
    # TRUSTED CLIENT IDENTITY
    # ========================================================================

    # NGINX only sees its own Envoy sidecar as the direct ingress peer.
    # Trust only that pod-local loopback hop so the derived client IP comes
    # from the rightmost ingress-appended X-Forwarded-For entry instead of any
    # caller-supplied leftmost value.
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    set_real_ip_from 127.0.0.0/8;

    # React dev server (in dev environment, in prod this serves static files)
    # NOTE: Using variable-based proxy_pass for dynamic DNS resolution
    # This allows NGINX to start before budget-analyzer-web is available

    # React frontend (budget-analyzer-web)
    # NOTE: Using variable-based proxy_pass for dynamic DNS resolution
    # This allows NGINX to start before budget-analyzer-web is available

    # ========================================================================
    # API GATEWAY SERVER BLOCK (HTTP only - TLS handled by Istio ingress)
    # ========================================================================
    server {
        listen 8080;
        server_name _;

        # Prevent absolute redirects and port issues
        absolute_redirect off;
        port_in_redirect off;

        # Default proxy timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # ========================================================================
        # SECURITY HEADERS
        # ========================================================================

        # Default to the relaxed Vite/HMR policy. Route-specific locations that
        # add headers must re-include the full policy set so NGINX does not drop
        # the inherited security headers.
        include includes/security-headers-dev-csp.conf;

        # Health check endpoint
        location /health {
            access_log off;
            include includes/security-headers-dev-csp.conf;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Favicon - return 204 No Content
        location = /favicon.ico {
            access_log off;
            log_not_found off;
            return 204;
        }

        # ========================================================================
        # PUBLIC DOCS ROUTE
        # ========================================================================

        include includes/api-docs-routes.conf;

        # ========================================================================
        # API ROUTES
        # ========================================================================

        # Production-smoke frontend bundle served statically from NGINX.
        # This stays on the public origin for browser-policy verification while
        # the normal dev route continues to proxy to the Vite pod.
        location = /_prod-smoke {
            include includes/security-headers-strict-csp.conf;
            return 302 /_prod-smoke/;
        }

        location ^~ /_prod-smoke/ {
            include includes/security-headers-strict-csp.conf;
            root /usr/share/nginx/html;
            try_files $uri $uri/ /_prod-smoke/index.html;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        }

        # Shared API routes, including the decoded ";" rejection and the
        # unknown-route rejections.
        include includes/api-routes.conf;

        # ========================================================================
        # FRONTEND ROUTES (React App via Vite)
        # ========================================================================

        # Vite HMR WebSocket - requires special handling
        location /@vite/client {
            set $frontend_backend "http://budget-analyzer-web.default.svc.cluster.local:3000";
            proxy_pass $frontend_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Vite node_modules
        location /node_modules {
            set $frontend_backend "http://budget-analyzer-web.default.svc.cluster.local:3000";
            proxy_pass $frontend_backend;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Static assets
        location /assets {
            set $frontend_backend "http://budget-analyzer-web.default.svc.cluster.local:3000";
            proxy_pass $frontend_backend;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Vite source files
        location /src {
            set $frontend_backend "http://budget-analyzer-web.default.svc.cluster.local:3000";
            proxy_pass $frontend_backend;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Default: Proxy to React frontend (SPA catch-all)
        location / {
            set $frontend_backend "http://budget-analyzer-web.default.svc.cluster.local:3000";
            proxy_pass $frontend_backend;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # WebSocket support for HMR
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
