pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main 'remote_addr=$remote_addr proxy_addr=$realip_remote_addr xff="$http_x_forwarded_for" '
                    'xrealip="$http_x_real_ip" request="$request" '
                    'status=$status body_bytes_sent=$body_bytes_sent';
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    resolver kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off;
    resolver_timeout 5s;

    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    set_real_ip_from 127.0.0.0/8;

    server {
        listen 8080;
        server_name _;

        absolute_redirect off;
        port_in_redirect off;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Production serves the built frontend bundle directly from NGINX and
        # applies the strict frontend policy on the normal app routes.
        include includes/security-headers-strict-csp.conf;

        location /health {
            access_log off;
            include includes/security-headers-strict-csp.conf;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location = /favicon.ico {
            access_log off;
            log_not_found off;
            return 204;
        }

        # ========================================================================
        # PUBLIC DOCS ROUTE
        # ========================================================================

        include includes/api-docs-routes.conf;

        # ========================================================================
        # API ROUTES
        # ========================================================================

        # Shared API routes, including the decoded ";" rejection and the
        # unknown-route rejections.
        include includes/api-routes.conf;

        # Production must not expose the local Vite/HMR route set or the
        # local-only smoke seam.
        location = /@vite/client {
            return 404;
        }

        location = /_prod-smoke {
            return 404;
        }

        location ^~ /_prod-smoke/ {
            return 404;
        }

        location = /src {
            return 404;
        }

        location ^~ /src/ {
            return 404;
        }

        location = /node_modules {
            return 404;
        }

        location ^~ /node_modules/ {
            return 404;
        }

        location ^~ /assets/ {
            include includes/security-headers-strict-csp.conf;
            root /usr/share/nginx/html;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location = /login {
            include includes/security-headers-strict-csp.conf;
            root /usr/share/nginx/html;
            try_files /index.html =404;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        }

        location = / {
            include includes/security-headers-strict-csp.conf;
            root /usr/share/nginx/html;
            try_files /index.html =404;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        }

        location / {
            include includes/security-headers-strict-csp.conf;
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        }
    }
}
