# Intentional failure: default-deny-all is missing.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: transaction-service-policy
  namespace: default
spec:
  selector:
    matchLabels:
      app: transaction-service
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/default/sa/nginx-gateway"]
      to:
        - operation:
            paths: ["/transaction-service/v1/transactions", "/transaction-service/v1/transactions/*"]
---
