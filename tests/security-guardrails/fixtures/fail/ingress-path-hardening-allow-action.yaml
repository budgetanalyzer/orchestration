# Intentional failing fixture for scan_istio_ingress_path_hardening_contract.
# The RBAC filter allows instead of denying.
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: ingress-path-hardening
  namespace: istio-ingress
spec:
  workloadSelector:
    labels:
      gateway.networking.k8s.io/gateway-name: istio-ingress-gateway
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.ext_authz
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.rbac.ingress_path_hardening
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
            rules:
              action: ALLOW
              policies:
                deny-semicolon-in-path:
                  permissions:
                    - header:
                        name: ":path"
                        string_match:
                          safe_regex:
                            regex: "^[^?]*(;|%3[bB]|%253[bB]).*$"
                  principals:
                    - any: true
