# Port-only external egress allows 443 to every private range.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-istio-egress-external-egress
  namespace: istio-egress
spec:
  podSelector:
    matchLabels:
      istio: egress-gateway
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 443
