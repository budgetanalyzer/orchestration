# Intentional failing fixture for scan_nginx_shared_route_contract.
# A server config that includes the shared routes but keeps its own API route.
server {
    listen 8080;

    include includes/api-docs-routes.conf;
    include includes/api-routes.conf;

    location /api/v1/reports {
        set $transaction_backend "http://transaction-service.default.svc.cluster.local:8082";
        rewrite ^/api/v1/(.*)$ /transaction-service/v1/$1 break;
        proxy_pass $transaction_backend;
        include includes/backend-headers.conf;
    }
}
