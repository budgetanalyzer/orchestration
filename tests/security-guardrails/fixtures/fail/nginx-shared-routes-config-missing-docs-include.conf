# Intentional failing fixture for scan_nginx_shared_route_contract.
# A server config that keeps its own /api-docs copy instead of the shared include.
server {
    listen 8080;

    location ~ ^/api-docs/(openapi\.(json|yaml))$ {
        alias /usr/share/nginx/html/docs/$1;
    }

    include includes/api-routes.conf;
}
